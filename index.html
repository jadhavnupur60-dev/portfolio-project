<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Site</title>

  <!-- Linked Minified CSS File -->
  <link rel="stylesheet" href="assets/css/styles.min.css">
</head>
<body>

  <header>
    <h1>My Portfolio</h1>
    <button id="menu-toggle">Menu</button>
  </header>

  <main>
    <section class="gallery">
      <!-- Native lazy loading with explicit width and height -->
      <img src="assets/images/project1.jpg" alt="Project 1 Preview" width="600" height="400" loading="lazy">
      <img src="assets/images/project2.jpg" alt="Project 2 Preview" width="600" height="400" loading="lazy">
      <img src="assets/images/avatar.png" alt="Profile Picture" width="200" height="200" loading="lazy">
    </section>
  </main>

  <!-- Linked Minified JS File with defer -->
  <script src="assets/js/script.min.js" defer></script>
</body>
</html>
